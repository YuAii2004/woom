name: 部署到 Fly

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 部署代理服务
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: 部署到 fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
