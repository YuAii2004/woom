name: Playwright End-to-End Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chrome, firefox, edge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Start meeting dependency services
        run: docker compose up -d --wait redis live777

      - name: Install Playwright browsers and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright browser
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Run end-to-end tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          LIVE777_URL: http://127.0.0.1:7777

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
