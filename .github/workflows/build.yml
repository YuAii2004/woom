name: 构建与静态检查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装前端依赖
        run: npm ci

      - name: 检查 Vue 并构建前端
        run: npm run lint:vue && npm run build

      - name: 检查 React 回退实现
        run: npm run lint && npm run build:react

      - name: 检查 Go 回退实现
        run: go test ./... && go vet ./...

      - name: 检查 Rust 服务
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check && cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings && cargo test --manifest-path rust/Cargo.toml

      - name: 构建 Rust/Vue 镜像
        run: docker build -t woom:ci .
